<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王船館展區規劃系統</title>
<style>
  :root {
    --bg: #F4F1ED;
    --surface: #FFFFFF;
    --border: #E5DDD3;
    --border-soft: #EDE8E2;
    --text: #1C1008;
    --text-muted: #92877A;
    --text-light: #B5A99C;
    --accent: #4A2E18;
    --accent-mid: #7A4E2D;
    --accent-light: #F2EAE0;
    --accent-hover: #3A2210;
    --drag-over: #EEF5EE;
    --danger: #C0392B;
    --pending: #D4680A;
    --pending-bg: #FEF3E8;
    --shadow-sm: 0 1px 4px rgba(26,16,4,0.07);
    --shadow: 0 3px 12px rgba(26,16,4,0.09);
    --shadow-lg: 0 8px 32px rgba(26,16,4,0.12);
    --radius: 10px;
    --header-h: 52px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ── Header ───────────────────────────────────────── */
  header {
    background: var(--accent); color: white;
    height: var(--header-h); padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.08);
  }
  .header-logo { display: flex; flex-direction: column; }
  .header-logo h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.3px; line-height: 1; }
  .header-logo span { font-size: 11px; opacity: 0.55; margin-top: 3px; letter-spacing: 0.2px; }
  .header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.2); }
  .header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .btn { padding: 0 14px; height: 32px; border-radius: 6px; border: none; cursor: pointer; font-size: 12.5px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-family: inherit; }
  .btn-ghost { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); }
  .btn-ghost:hover { background: rgba(255,255,255,0.18); color: white; }
  .btn-ghost.dimmed { opacity: 0.35; cursor: default; }
  .btn-ghost.dimmed:hover { background: rgba(255,255,255,0.1); }
  .btn-white { background: white; color: var(--accent); font-weight: 600; }
  .btn-white:hover { background: var(--accent-light); }

  /* ── Layout ───────────────────────────────────────── */
  .layout { display: flex; height: calc(100vh - var(--header-h) - 36px); overflow: hidden; }

  /* ── Sidebar ──────────────────────────────────────── */
  .sidebar { width: 296px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border-soft); }
  .sidebar-title { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .sidebar-title h2 { font-size: 13px; font-weight: 700; }
  .sidebar-title .count-badge { font-size: 11px; background: var(--accent-light); color: var(--accent-mid); font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-light); pointer-events: none; }
  .search-wrap input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--border); border-radius: 7px; font-size: 12.5px; background: var(--bg); transition: all 0.15s; font-family: inherit; }
  .search-wrap input:focus { outline: none; border-color: var(--accent-mid); background: white; box-shadow: 0 0 0 3px rgba(122,78,45,0.1); }
  .filter-mode-bar { display: flex; gap: 4px; padding: 8px 16px 4px; }
  .fmt-btn { flex: 1; padding: 4px 0; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted); transition: all 0.12s; font-family: inherit; }
  .fmt-btn:hover { background: var(--accent-light); color: var(--accent); }
  .fmt-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .school-filters { padding: 6px 16px 10px; border-bottom: 1px solid var(--border-soft); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .filter-chip { padding: 3px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; border: 1px solid transparent; transition: all 0.12s; font-weight: 600; background: transparent; }
  .filter-chip:hover { background: var(--accent-light); }
  .filter-chip.active { border-color: currentColor; background: white; box-shadow: var(--shadow-sm); }
  .filter-chip.done { color: var(--text-light) !important; font-weight: 400; }
  .exhibit-pool { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  .pool-empty { text-align: center; padding: 32px 16px; color: var(--text-light); font-size: 12px; }

  /* ── Zone panel ───────────────────────────────────── */
  .zones-panel { flex: 1; overflow-x: auto; overflow-y: auto; }
  .zones-inner { display: flex; gap: 10px; padding: 12px; min-height: 100%; min-width: fit-content; }
  .zone-col {
    width: 216px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .zone-header { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background 0.15s; }
  .zone-header:hover { background: var(--accent-light); }
  .zone-header-top { display: flex; align-items: center; gap: 7px; }
  .zone-num { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 4px; background: var(--accent); color: white; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .zone-header h3 { font-size: 13px; font-weight: 700; color: var(--text); flex: 1; }
  .zone-header .arrow { color: var(--text-light); font-size: 13px; }
  .zone-header .zone-count { font-size: 11px; font-weight: 700; color: var(--accent-mid); }
  .zone-header .zone-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-drop { flex: 1; overflow-y: auto; padding: 7px; display: flex; flex-direction: column; gap: 4px; min-height: 60px; transition: background 0.15s; }
  .zone-drop.drag-over { background: var(--drag-over); border-radius: 0 0 8px 8px; }
  .zone-drop.empty::after { content: "拖曳展品至此"; display: flex; align-items: center; justify-content: center; height: 44px; color: var(--text-light); font-size: 11px; border: 1.5px dashed var(--border); border-radius: 6px; margin: 2px; }

  /* ── Exhibit cards (kanban) ───────────────────────── */
  .exhibit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px 7px;
    cursor: grab; user-select: none; transition: box-shadow 0.15s, transform 0.1s;
    border-left: 3px solid transparent; position: relative;
  }
  .exhibit-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .exhibit-card.dragging { opacity: 0.35; transform: rotate(1.5deg); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .exhibit-card .card-school { font-size: 10px; font-weight: 700; letter-spacing: 0.2px; }
  .exhibit-card .card-name { font-size: 12px; font-weight: 600; line-height: 1.45; color: var(--text); }
  .exhibit-card .card-equip { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .exhibit-card .card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .exhibit-card .tag { padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; background: var(--accent-light); color: var(--accent-mid); }
  .exhibit-card .tag.pending { background: var(--pending-bg); color: var(--pending); }
  .exhibit-card .remove-btn { background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 13px; line-height: 1; padding: 1px 2px; opacity: 0; transition: opacity 0.1s; }
  .exhibit-card:hover .remove-btn { opacity: 1; }
  .exhibit-card .remove-btn:hover { color: var(--danger); }
  .pending-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); flex-shrink: 0; margin-top: 1px; }
  .exhibit-card.is-pending { background: var(--pending-bg); border-color: #F5CFA0; }

  /* ── Stats bar ────────────────────────────────────── */
  .stats-bar { height: 36px; background: var(--surface); border-top: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 24px; font-size: 11.5px; color: var(--text-muted); }
  .stats-bar .stat-item b { color: var(--text); font-weight: 600; }
  .stats-bar .stat-divider { width: 1px; height: 14px; background: var(--border); }

  /* ── Modal ────────────────────────────────────────── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,8,2,0.45); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 14px; padding: 0; width: 460px; max-width: 95vw; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
  .modal-head { padding: 18px 22px 16px; border-bottom: 1px solid var(--border-soft); }
  .modal-head h3 { font-size: 15px; font-weight: 700; }
  .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
  .modal .form-group { margin-bottom: 16px; }
  .modal label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; color: var(--text-muted); }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; transition: all 0.15s; font-family: inherit; color: var(--text); background: var(--bg); }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--accent-mid); background: white; box-shadow: 0 0 0 3px rgba(122,78,45,0.1); }
  .modal textarea { resize: vertical; min-height: 64px; }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--border-soft); display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: all 0.15s; }
  .btn-cancel:hover { background: var(--border); color: var(--text); }
  .btn-save { background: var(--accent); color: white; border: none; padding: 8px 20px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.15s; }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-delete { background: none; color: var(--danger); border: 1px solid #f0c0bb; padding: 8px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: all 0.15s; }
  .btn-delete:hover { background: #fdf0ee; border-color: var(--danger); }

  /* ── Summary modal ────────────────────────────────── */
  .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .summary-table th { background: var(--accent-light); font-weight: 600; padding: 8px 10px; text-align: left; border-bottom: 2px solid var(--border); font-size: 11px; letter-spacing: 0.3px; }
  .summary-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-soft); }
  .summary-table tbody tr:last-child td { border-bottom: none; }
  .summary-table tbody tr:hover td { background: var(--bg); }

  /* ── Zone detail full page ────────────────────────── */
  .zone-detail-overlay { display: none; flex: 1; flex-direction: column; overflow: hidden; background: var(--bg); }
  .zone-detail-overlay.open { display: flex; }
  .zd-header {
    background: #fff8f4; color: var(--text);
    height: 60px; padding: 0 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    border-bottom: 2px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .zd-header .back-btn { background: white; border: 1px solid var(--border); color: var(--accent); height: 34px; padding: 0 14px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.15s; }
  .zd-header .back-btn:hover { background: var(--accent-light); border-color: var(--accent-mid); }
  .zd-zone-badge { font-size: 11px; font-weight: 700; background: var(--accent); color: white; border-radius: 5px; padding: 2px 8px; letter-spacing: 0.3px; }
  .zd-title-block { display: flex; flex-direction: column; }
  .zd-title-block h2 { font-size: 15px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .zd-title-block p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .zd-stats { display: flex; gap: 20px; margin-left: auto; padding-left: 16px; border-left: 1px solid var(--border); }
  .zd-stat { text-align: center; padding: 0 6px; }
  .zd-stat .sn { font-size: 20px; font-weight: 800; line-height: 1; color: var(--accent); }
  .zd-stat .sl { font-size: 9.5px; opacity: 0.6; margin-top: 3px; letter-spacing: 0.3px; }
  .zd-body { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .zd-empty-drop { min-height: 160px !important; display: flex !important; flex-wrap: nowrap !important; align-items: center !important; align-content: center !important; justify-content: center !important; border-radius: 10px !important; }
  .zd-empty-state { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); text-align: center; pointer-events: none; }
  .zd-empty-state p { font-size: 13px; margin: 0; color: var(--text-light); font-weight: 500; }
  .zd-empty-state small { font-size: 11.5px; opacity: 0.65; }

  .zd-schools { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 28px; }
  .zd-school-chip { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; color: white; letter-spacing: 0.2px; }

  .zd-section-label { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .zd-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }

  .zd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 32px; }
  .zd-card {
    background: white; border: 1px solid var(--border); border-radius: 8px;
    border-left: 3px solid transparent; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
    transition: box-shadow 0.15s;
  }
  .zd-card:hover { box-shadow: var(--shadow); }
  .zd-card .zdc-school { font-size: 10px; font-weight: 700; white-space: nowrap; }
  .zd-card .zdc-info { flex: 1; min-width: 0; }
  .zd-card .zdc-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zd-card .zdc-equip { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .zd-card .zdc-tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--accent-light); color: var(--accent-mid); white-space: nowrap; font-weight: 500; }
  .zd-card .zdc-tag.pending { background: var(--pending-bg); color: var(--pending); }
  .zd-card .zdc-remove { background: none; border: none; cursor: pointer; color: var(--border); font-size: 14px; padding: 0 2px; line-height: 1; flex-shrink: 0; transition: color 0.1s; }
  .zd-card .zdc-remove:hover { color: var(--danger); }

  .equip-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 24px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .equip-table th { background: var(--accent-light); font-weight: 600; padding: 9px 14px; text-align: left; font-size: 11px; letter-spacing: 0.3px; color: var(--accent); }
  .equip-table td { padding: 9px 14px; border-top: 1px solid var(--border-soft); }
  .equip-table tbody tr:hover td { background: var(--bg); }

  /* ── Tag picker ───────────────────────────────────── */
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag-chip { padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); transition: all 0.12s; user-select: none; font-family: inherit; }
  .tag-chip:hover { border-color: var(--accent-mid); color: var(--accent); background: var(--accent-light); }
  .tag-chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .tag-chip .del-tag { margin-left: 5px; font-size: 10px; opacity: 0; transition: opacity 0.1s; }
  .tag-chip:hover .del-tag { opacity: 0.5; }
  .tag-chip:hover .del-tag:hover { opacity: 1; }
  .tag-add-row { display: flex; gap: 6px; margin-top: 4px; }
  .tag-add-row input { flex: 1; }
  .tag-add-btn { height: 36px; padding: 0 14px; background: var(--bg); color: var(--accent-mid); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 16px; font-weight: 400; font-family: inherit; transition: all 0.15s; }
  .tag-add-btn:hover { border-color: var(--accent-mid); background: var(--accent-light); }

  /* ── Undo ─────────────────────────────────────────── */
  #undo-btn { transition: opacity 0.15s; }
  #undo-btn.dimmed { opacity: 0.3; cursor: default; }

  /* ── Scrollbar ────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
  /* ── Login overlay ───────────────────────────────────── */
  .login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 40px 36px; width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .login-title { font-size: 18px; font-weight: 700; color: var(--accent); text-align: center; }
  .login-sub { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: -8px; }
  .login-box input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; font-family: inherit; background: var(--bg); color: var(--text); transition: border-color 0.15s; }
  .login-box input:focus { outline: none; border-color: var(--accent-mid); background: white; }
  .login-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .login-btn:hover { background: var(--accent-hover); }
  .login-error { font-size: 12px; color: var(--danger); text-align: center; min-height: 16px; }

  /* ── Zone detail planning cards ──────────────────────── */
  .zd-plan-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 28px; }
  .zd-plan-card {
    background: white; border: 1px solid var(--border);
    border-left: 3px solid transparent; border-radius: 6px;
    padding: 6px 10px; transition: box-shadow 0.15s;
    width: 220px; flex-shrink: 0;
  }
  .zd-plan-card:hover { box-shadow: var(--shadow-sm); }
  .zd-plan-card.zd-dragging { opacity: 0.35; }
  .zd-plan-card.zd-drag-over { border-top: 2px solid var(--accent); background: var(--accent-light); }
  .zd-plan-card.is-pending { background: var(--pending-bg); border-color: #F5CFA0; }
  .pc-top { display: flex; align-items: center; gap: 7px; }
  .pc-drag { cursor: grab; color: var(--text-light); font-size: 12px; flex-shrink: 0; line-height: 1; }
  .pc-drag:active { cursor: grabbing; }
  .pc-school { font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .pc-name { font-size: 12px; font-weight: 600; flex: 1; color: var(--text); }
  .pc-equip-inline { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .pc-pending-badge { font-size: 10px; background: var(--pending-bg); color: var(--pending); padding: 1px 5px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .pc-remove { background: none; border: none; cursor: pointer; color: var(--border); font-size: 13px; padding: 0 2px; flex-shrink: 0; transition: color 0.1s; line-height: 1; opacity: 0; }
  .zd-plan-card:hover .pc-remove { opacity: 1; }
  .pc-remove:hover { color: var(--danger); }
  .pc-notes {
    display: none; width: calc(100% - 18px); margin-left: 18px; margin-top: 5px;
    padding: 4px 7px; border: 1px solid var(--border-soft); border-radius: 4px;
    font-size: 11.5px; font-family: inherit; resize: none; background: var(--bg);
    color: var(--text); transition: border-color 0.15s; overflow: hidden;
  }
  .zd-plan-card:focus-within .pc-notes,
  .zd-plan-card .pc-notes:not(:placeholder-shown) { display: block; }
  .pc-notes:focus { outline: none; border-color: var(--accent-mid); background: white; display: block; }
  .pc-notes::placeholder { color: var(--text-light); }

  /* ── Zone add/delete ────────────────────────────────────────── */
  .zone-header { position: relative; }
  .zone-col { cursor: grab; }
  .zone-col:active { cursor: grabbing; }
  .zone-col.zone-col-drag-over { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-light); }
  .zone-col.zone-col-dragging { opacity: 0.4; }
  .zone-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
  .zone-header:hover .zone-actions { opacity: 1; }

let tagLibrary = [];   // fully user-managed, persisted to localStorage
let selectedTags = [];

function saveCustomTags() { saveData(); }

function renderTagPicker() {
  const row = document.getElementById('tag-preset-row');
  row.innerHTML = tagLibrary.map(t => {
    const isSel = selectedTags.includes(t);
    return `<span class="tag-chip${isSel?' selected':''}" onclick="toggleTag('${t}')">
      ${t}<span class="del-tag" onclick="deleteCustomTag(event,'${t}')">✕</span>
    </span>`;
  }).join('');
}

function toggleTag(tag) {
  if (selectedTags.includes(tag)) {
    selectedTags = selectedTags.filter(t => t !== tag);
  } else {
    selectedTags.push(tag);
  }
  renderTagPicker();
}

function addCustomTag() {
  const input = document.getElementById('tag-new-input');
  const val = input.value.trim();
  if (!val) return;
  const isNew = !tagLibrary.includes(val);
  if (isNew) tagLibrary.push(val);
  if (!selectedTags.includes(val)) selectedTags.push(val);
  input.value = '';
  renderTagPicker();
  if (isNew) saveData();
}

function handleTagInput(event) {
  if (event.key === 'Enter') { event.preventDefault(); addCustomTag(); }
}

function deleteCustomTag(event, tag) {
  event.stopPropagation();
  tagLibrary = tagLibrary.filter(t => t !== tag);
  selectedTags = selectedTags.filter(t => t !== tag);
  saveCustomTags();
  renderTagPicker();
}

// ── State ──────────────────────────────────────────────────────
let exhibits = [];
let filterSchools = new Set();
let filterTags = new Set();
let filterMode = 'school';
let editingId = null;
let dragId = null;
let history = [];
let zoneGroups = {};
const MAX_HISTORY = 50;

function setFilterMode(mode) {
  filterMode = mode;
  filterSchools.clear();
  filterTags.clear();
  document.getElementById('fmt-school').classList.toggle('active', mode === 'school');
  document.getElementById('fmt-tag').classList.toggle('active', mode === 'tag');
  renderAll();
}

function snapshot() {
  history.push(JSON.stringify({ exhibits, zones, zoneGroups }));
  if (history.length > MAX_HISTORY) history.shift();
  document.getElementById('undo-btn').classList.remove('dimmed');
}

function undo() {
  if (!history.length) return;
  const state = JSON.parse(history.pop());
  exhibits   = state.exhibits;
  zones      = state.zones;
  zoneGroups = state.zoneGroups;
  if (history.length === 0) document.getElementById('undo-btn').classList.add('dimmed');
  renderAll();
  saveData();
}

function saveData() {
  db.collection('data').doc('main').set({ exhibits, tagLibrary, zoneGroups, zones })
    .then(() => {
      const btn = document.querySelector('.btn-white');
      if (btn) { btn.textContent = '已儲存 ✓'; setTimeout(() => btn.textContent = '儲存', 1500); }
    });
}

// ── Drag & Drop ────────────────────────────────────────────────
function onDragStart(event, id) {
  dragId = id;
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.classList.add('dragging');
  }, 0);
}
function onDragEnd(event) {
  if (dragId) {
    const el = document.getElementById('card-' + dragId);
    if (el) el.classList.remove('dragging');
  }
  dragId = null;
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}
function onDragOver(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}
function onDragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}
function onDrop(event, zoneId) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if (!dragId) return;
  const ex = exhibits.find(e => e.id === dragId);
  if (ex && ex.zone !== zoneId) {
    snapshot();
    ex.zone = zoneId;
    renderAll();
    saveData();
  }
}

// ── Render ─────────────────────────────────────────────────────
function schoolById(id) { return SCHOOLS.find(s => s.id === id) || { name: id, color: '#888' }; }

function makeCard(ex, inZone) {
  const school = schoolById(ex.school);
  const div = document.createElement('div');
  div.className = 'exhibit-card' + (ex.status === 'pending' ? ' is-pending' : '');
  div.id = 'card-' + ex.id;
  div.style.borderLeftColor = school.color;
  div.draggable = true;
  div.addEventListener('dragstart', e => onDragStart(e, ex.id));
  div.addEventListener('dragend', onDragEnd);
  div.addEventListener('dblclick', () => openEditModal(ex.id));

  const tags = ex.tags.map(t => `<span class="tag">${t}</span>`).join('');

  div.innerHTML = `
    <div class="card-top">
      <span class="card-school" style="color:${school.color}">${school.name}</span>
      <div style="display:flex;align-items:center;gap:5px">
        ${ex.status === 'pending' ? '<span class="pending-dot" title="待確認"></span>' : ''}
        ${inZone ? `<button class="remove-btn" onclick="removeFromZone('${ex.id}',event)" title="移回未分配">✕</button>` : ''}
      </div>
    </div>
    <div class="card-name">${ex.name}</div>
    ${ex.equipment ? `<div class="card-equip">${ex.equipment}</div>` : ''}
    ${tags ? `<div class="card-tags">${tags}</div>` : ''}
  `;
  return div;
}

function removeFromZone(id, event) {
  event.stopPropagation();
  const ex = exhibits.find(e => e.id === id);
  if (ex) { snapshot(); ex.zone = 'pool'; renderAll(); saveData(); }
}

function renderAll() {
  const q = document.getElementById('search-input').value.toLowerCase();

  // Render school filters
  const filtersEl = document.getElementById('school-filters');
  filtersEl.innerHTML = '';
  if (filterMode === 'school') {
    SCHOOLS.forEach(s => {
      const total = exhibits.filter(e => e.school === s.id).length;
      if (!total) return;
      const unassigned = exhibits.filter(e => e.school === s.id && e.zone === 'pool').length;
      const done = unassigned === 0;
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (filterSchools.has(s.id) ? ' active' : '') + (done ? ' done' : '');
      chip.style.color = done ? '' : s.color;
      chip.style.background = filterSchools.has(s.id) ? s.color + '20' : 'transparent';
      chip.textContent = done ? `${s.name} ✓` : `${s.name} (${unassigned})`;
      chip.onclick = () => {
        if (filterSchools.has(s.id)) filterSchools.delete(s.id);
        else filterSchools.add(s.id);
        renderAll();
      };
      filtersEl.appendChild(chip);
    });
  } else {
    tagLibrary.forEach(tag => {
      const unassigned = exhibits.filter(e => e.zone === 'pool' && e.tags.includes(tag)).length;
      const total = exhibits.filter(e => e.tags.includes(tag)).length;
      if (!total) return;
      const done = unassigned === 0;
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (filterTags.has(tag) ? ' active' : '') + (done ? ' done' : '');
      chip.style.color = done ? '' : 'var(--accent-mid)';
      chip.textContent = done ? `${tag} ✓` : `${tag} (${unassigned})`;
      chip.onclick = () => {
        if (filterTags.has(tag)) filterTags.delete(tag);
        else filterTags.add(tag);
        renderAll();
      };
      filtersEl.appendChild(chip);
    });
    const untaggedPool = exhibits.filter(e => e.zone === 'pool' && e.tags.length === 0).length;
    const untaggedTotal = exhibits.filter(e => e.tags.length === 0).length;
    if (untaggedTotal > 0) {
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (filterTags.has('__untagged__') ? ' active' : '') + (untaggedPool === 0 ? ' done' : '');
      chip.style.color = untaggedPool === 0 ? '' : 'var(--text-muted)';
      chip.textContent = untaggedPool === 0 ? '其他 ✓' : `其他 (${untaggedPool})`;
      chip.onclick = () => {
        if (filterTags.has('__untagged__')) filterTags.delete('__untagged__');
        else filterTags.add('__untagged__');
        renderAll();
      };
      filtersEl.appendChild(chip);
    }
  }

  // Pool (unassigned)
  const poolEl = document.getElementById('pool-drop');
  poolEl.innerHTML = '';
  const poolItems = exhibits.filter(e => {
    if (e.zone !== 'pool') return false;
    if (filterMode === 'school' && filterSchools.size > 0 && !filterSchools.has(e.school)) return false;
    if (filterMode === 'tag' && filterTags.size > 0) {
      const matchTag = e.tags.some(t => filterTags.has(t));
      const matchUntagged = filterTags.has('__untagged__') && e.tags.length === 0;
      if (!matchTag && !matchUntagged) return false;
    }
    if (q && !e.name.toLowerCase().includes(q) && !schoolById(e.school).name.includes(q)) return false;
    return true;
  });
  poolItems.forEach(ex => poolEl.appendChild(makeCard(ex, false)));
  if (!poolItems.length) poolEl.innerHTML = '<div class="pool-empty">全部已分配完畢 ✓</div>';
  const unassignedCount = exhibits.filter(e=>e.zone==='pool').length;
  document.getElementById('unassigned-count').textContent = unassignedCount;

  // Make pool droppable
  poolEl.ondragover = e => onDragOver(e);
  poolEl.ondragleave = e => onDragLeave(e);
  poolEl.ondrop = e => onDrop(e, 'pool');

  // Zones
  const zonesEl = document.getElementById('zones-inner');
  zonesEl.innerHTML = '';
  zones.forEach(zone => {
    const col = document.createElement('div');
    col.className = 'zone-col';

    const items = exhibits.filter(e => {
      if (e.zone !== zone.id) return false;
      if (filterSchools.size > 0 && !filterSchools.has(e.school)) return false;
      if (q && !e.name.toLowerCase().includes(q) && !schoolById(e.school).name.includes(q)) return false;
      return true;
    });
    const totalInZone = exhibits.filter(e => e.zone === zone.id).length;

    col.id = 'zone-col-' + zone.id;
    col.draggable = true;
    col.ondragstart = e => { if (!dragId) zoneColDragStart(e, zone.id); };
    col.ondragend   = e => zoneColDragEnd();
    col.ondragover  = e => zoneColDragOver(e, zone.id);
    col.ondrop      = e => zoneColDrop(e, zone.id);
    col.innerHTML = `
      <div class="zone-header" onclick="openZoneDetail('${zone.id}')">
        <div class="zone-header-top">
          <span class="zone-num">${zones.indexOf(zone) + 1}</span>
          <h3>${zone.name}</h3>
          <span class="zone-count">${totalInZone} 件</span>
          <span class="arrow">›</span>
        </div>
        <div class="zone-desc">${zone.desc}</div>
        <div class="zone-actions">
          <button class="zone-act-btn" onclick="editZone(event,'${zone.id}')" title="編輯展區"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="zone-act-btn danger" onclick="deleteZone(event,'${zone.id}')" title="移除展區"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
        </div>
      </div>
    `;
    const drop = document.createElement('div');
    drop.className = 'zone-drop' + (items.length === 0 ? ' empty' : '');
    drop.ondragover = e => onDragOver(e);
    drop.ondragleave = e => onDragLeave(e);
    drop.ondrop = e => onDrop(e, zone.id);
    items.forEach(ex => drop.appendChild(makeCard(ex, true)));
    col.appendChild(drop);
    zonesEl.appendChild(col);
  });

  // 新增展區按鈕
  const addCol = document.createElement('div');
  addCol.className = 'zone-col zone-add-col';
  addCol.innerHTML = `<button class="zone-add-btn" onclick="openAddZoneModal()">＋<br>新增展區</button>`;
  zonesEl.appendChild(addCol);

  // Stats
  const total = exhibits.length;
  const assigned = exhibits.filter(e => e.zone !== 'pool').length;
  const pending = exhibits.filter(e => e.status === 'pending').length;
  document.getElementById('stats-bar').innerHTML = `
    <span class="stat-item">展品總數 <b>${total}</b></span>
    <span class="stat-divider"></span>
    <span class="stat-item">已分配 <b>${assigned}</b></span>
    <span class="stat-divider"></span>
    <span class="stat-item">未分配 <b>${total-assigned}</b></span>
    <span class="stat-divider"></span>
    <span class="stat-item" style="color:${pending?'var(--pending)':'inherit'}">待確認 <b>${pending}</b></span>`;
}

// ── Add / Edit Modal ────────────────────────────────────────────
function openAddModal() {
  editingId = null;
  selectedTags = [];
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('modal-title').textContent = '新增展品';
  document.getElementById('f-name').value = '';
  document.getElementById('f-equipment').value = '';
    document.getElementById('f-status').value = 'confirmed';
  document.getElementById('tag-new-input').value = '';
  renderTagPicker();
  document.getElementById('modal-overlay').classList.add('open');
}
function openEditModal(id) {
  const ex = exhibits.find(e => e.id === id);
  if (!ex) return;
  editingId = id;
  selectedTags = [...ex.tags];
  document.getElementById('modal-title').textContent = '編輯展品';
  document.getElementById('f-school').value = ex.school;
  document.getElementById('f-name').value = ex.name;
  document.getElementById('f-equipment').value = ex.equipment;
  document.getElementById('f-status').value = ex.status;
  document.getElementById('tag-new-input').value = '';
  // 確保展品已有的標籤都在標籤庫裡
  ex.tags.forEach(t => { if (!tagLibrary.includes(t)) tagLibrary.push(t); });
  renderTagPicker();
  document.getElementById('btn-delete').style.display = 'block';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function deleteExhibit() {
  if (!editingId) return;
  const ex = exhibits.find(e => e.id === editingId);
  if (!ex) return;
  if (!confirm(`確定刪除「${ex.name}」？此操作無法復原。`)) return;
  snapshot();
  exhibits = exhibits.filter(e => e.id !== editingId);
  closeModal();
  renderAll();
  saveData();
}
function saveExhibit() {
  const school = document.getElementById('f-school').value;
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('請填寫展品名稱'); return; }
  const tags = [...selectedTags];
  snapshot();
  if (editingId) {
    const ex = exhibits.find(e => e.id === editingId);
    Object.assign(ex, { school, name, equipment: document.getElementById('f-equipment').value, notes: ex.notes || '', status: document.getElementById('f-status').value, tags });
  } else {
    exhibits.push({ id: 'e' + Date.now(), school, name, equipment: document.getElementById('f-equipment').value, notes: '',status: document.getElementById('f-status').value, tags, zone: 'pool' });
  }
  // 把這次用到的標籤同步進標籤庫
  tags.forEach(t => { if (!tagLibrary.includes(t)) tagLibrary.push(t); });
  closeModal();
  renderAll();
  saveData();
}

// ── School select population ────────────────────────────────────
function initSchoolSelect() {
  const sel = document.getElementById('f-school');
  if (sel.options.length > 0) return;
  SCHOOLS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
}

// ── Summary ────────────────────────────────────────────────────
function showSummary() {
  let html = '';
  zones.forEach(zone => {
    const items = exhibits.filter(e => e.zone === zone.id);
    html += `<h4 style="margin:14px 0 6px;color:var(--accent)">${zone.name}（${zone.desc}）</h4>`;
    if (!items.length) { html += '<p style="font-size:12px;color:var(--text-muted);margin-bottom:6px">尚無展品分配</p>'; return; }
    html += '<table class="summary-table"><thead><tr><th>學校</th><th>展品名稱</th><th>備注</th><th>狀態</th></tr></thead><tbody>';
    items.forEach(ex => {
      const s = schoolById(ex.school);
      html += `<tr><td style="color:${s.color};font-weight:600">${s.name}</td><td>${ex.name}</td><td>${ex.equipment||'—'}</td><td>${ex.status==='pending'?'<span style="color:#e65100">待確認</span>':'已確認'}</td></tr>`;
    });
    html += '</tbody></table>';
  });
  const poolItems = exhibits.filter(e => e.zone === 'pool');
  if (poolItems.length) {
    html += `<h4 style="margin:14px 0 6px;color:#c0392b">未分配展品（${poolItems.length} 件）</h4>`;
    html += '<table class="summary-table"><thead><tr><th>學校</th><th>展品名稱</th><th>備注</th><th>狀態</th></tr></thead><tbody>';
    poolItems.forEach(ex => {
      const s = schoolById(ex.school);
      html += `<tr><td style="color:${s.color};font-weight:600">${s.name}</td><td>${ex.name}</td><td>${ex.equipment||'—'}</td><td>${ex.status==='pending'?'<span style="color:#e65100">待確認</span>':'已確認'}</td></tr>`;
    });
    html += '</tbody></table>';
  }
  document.getElementById('summary-content').innerHTML = html;
  document.getElementById('summary-overlay').classList.add('open');
}

function buildSummaryText() {
  let text = '王船館展區規劃總覽\n\n';
  zones.forEach(zone => {
    text += `【${zone.name}】${zone.desc}\n`;
    const items = exhibits.filter(e => e.zone === zone.id);
    if (!items.length) { text += '  （尚無展品）\n'; return; }
    items.forEach(ex => {
      const s = schoolById(ex.school);
      text += `  • ${s.name}｜${ex.name}｜${ex.equipment||'—'}${ex.status==='pending'?' [待確認]':''}\n`;
    });
    text += '\n';
  });
  const poolItems = exhibits.filter(e => e.zone === 'pool');
  if (poolItems.length) {
    text += `【未分配展品】（${poolItems.length} 件）\n`;
    poolItems.forEach(ex => {
      const s = schoolById(ex.school);
      text += `  • ${s.name}｜${ex.name}｜${ex.equipment||'—'}${ex.status==='pending'?' [待確認]':''}\n`;
    });
  }
  return text;
}

function copyText() {
  navigator.clipboard.writeText(buildSummaryText()).then(() => alert('已複製到剪貼簿'));
}

    });

function buildSummaryHTML() {
  let rows = '';
  zones.forEach(zone => {
    const items = exhibits.filter(e => e.zone === zone.id);
    rows += `<tr><td colspan="4" style="background:#F2EAE0;font-weight:700;color:#4A2E18;padding:8px 10px">${zone.name}　${zone.desc}</td></tr>`;
    if (!items.length) {
      rows += `<tr><td colspan="4" style="color:#aaa;padding:6px 10px">尚無展品分配</td></tr>`;
    } else {
      items.forEach(ex => {
        const s = schoolById(ex.school);
        rows += `<tr>
          <td style="color:${s.color};font-weight:700;padding:6px 10px;white-space:nowrap">${s.name}</td>
          <td style="padding:6px 10px">${ex.name}</td>
          <td style="padding:6px 10px;color:#666">${ex.equipment||'—'}</td>
          <td style="padding:6px 10px;color:${ex.status==='pending'?'#e65100':'#27ae60'}">${ex.status==='pending'?'待確認':'已確認'}</td>
        </tr>`;
      });
    }
  });
  const poolItems = exhibits.filter(e => e.zone === 'pool');
  if (poolItems.length) {
    rows += `<tr><td colspan="4" style="background:#fef3e8;font-weight:700;color:#c0392b;padding:8px 10px">未分配展品（${poolItems.length} 件）</td></tr>`;
    poolItems.forEach(ex => {
      const s = schoolById(ex.school);
      rows += `<tr>
        <td style="color:${s.color};font-weight:700;padding:6px 10px;white-space:nowrap">${s.name}</td>
        <td style="padding:6px 10px">${ex.name}</td>
        <td style="padding:6px 10px;color:#666">${ex.equipment||'—'}</td>
        <td style="padding:6px 10px;color:${ex.status==='pending'?'#e65100':'#27ae60'}">${ex.status==='pending'?'待確認':'已確認'}</td>
      </tr>`;
    });
  }
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
  <title>王船館展區規劃總覽</title>
  <style>
    body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:32px;color:#1C1008}
    h1{font-size:20px;margin-bottom:4px}
    p{font-size:12px;color:#888;margin-bottom:24px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    td,th{border:1px solid #e5ddd3}
    th{background:#4A2E18;color:white;padding:8px 10px;text-align:left}
  </style></head><body>
  <h1>王船館展區規劃總覽</h1>
  <p>青陽計畫 · 數位人文薈萃特展　匯出時間：${new Date().toLocaleString('zh-TW')}</p>
  <table><thead><tr><th>學校</th><th>展品名稱</th><th>備注</th><th>狀態</th></tr></thead>
  <tbody>${rows}</tbody></table>
  </body></html>`;
}

function downloadWord(btn) {
  const orig = btn.textContent;
  btn.textContent = '產生中…';
  btn.disabled = true;
  try {
    const html = buildSummaryHTML();
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '王船館展區規劃總覽.doc';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  } catch(e) {
    alert('匯出失敗：' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

function downloadPDF(btn) {
  if (typeof html2pdf === 'undefined') {
    alert('PDF 函式庫尚未載入，請重新整理頁面後再試');
    return;
  }
  const orig = btn.textContent;
  btn.textContent = '產生中…';
  btn.disabled = true;
  const div = buildExportDiv();
  document.body.appendChild(div);
  html2pdf().set({
    margin: [10, 10, 10, 10],
    filename: '王船館展區規劃總覽.pdf',
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(div).save().then(() => {
    document.body.removeChild(div);
    btn.textContent = orig;
    btn.disabled = false;
  }).catch(e => {
    if (document.body.contains(div)) document.body.removeChild(div);
    alert('PDF 匯出失敗：' + e.message);
    btn.textContent = orig;
    btn.disabled = false;
  });
}

// ── Zone Detail Full Page ──────────────────────────────────────
let currentZoneId = null;

function openZoneDetail(zoneId) {
  currentZoneId = zoneId;
  const zone = zones.find(z => z.id === zoneId);
  if (!zone) return;
  renderZoneDetail(zone);
  document.getElementById('zones-panel').style.display = 'none';

function renderPlanCard(ex, groupId, zoneId) {
  const s = schoolById(ex.school);
  const isPending = ex.status === 'pending';
  const safeNotes = (ex.notes || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tags = ex.tags.map(t => `<span class="tag">${t}</span>`).join('');
  return `<div class="exhibit-card zd-plan-card${isPending?' is-pending':''}" id="zd-pc-${ex.id}"
    style="border-left-color:${s.color};cursor:grab"
    draggable="true"
    ondragstart="zdGrpDragStart(event,'${ex.id}','${groupId}')"
    ondragend="zdGrpDragEnd()"
    ondragover="zdGrpCardOver(event,'${ex.id}')"
    ondrop="zdGrpCardDrop(event,'${ex.id}','${groupId}','${zoneId}')">
    <div class="card-top">
      <span class="card-school" style="color:${s.color}">${s.name}</span>
      <div style="display:flex;align-items:center;gap:5px">
        ${isPending ? '<span class="pending-dot" title="待確認"></span>' : ''}
        <button class="remove-btn" onclick="removeFromZoneDetail('${ex.id}','${zoneId}')" title="移回未分配">✕</button>
      </div>
    </div>
    <div class="card-name">${ex.name}</div>
    ${ex.equipment ? `<div class="card-equip">${ex.equipment}</div>` : ''}
    ${tags ? `<div class="card-tags">${tags}</div>` : ''}
    <textarea class="pc-notes" rows="1" placeholder="點此新增備注…"
      onblur="saveNotes('${ex.id}',this.value)"
      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
    >${safeNotes}</textarea>
  </div>`;
}

function renderZoneDetail(zone) {
  const zoneId = zone.id;
  const items = exhibits.filter(e => e.zone === zoneId);
  const schoolMap = {};
  items.forEach(ex => { schoolMap[ex.school] = (schoolMap[ex.school] || 0) + 1; });
  const pending = items.filter(e => e.status === 'pending').length;

  if (!zoneGroups[zoneId]) zoneGroups[zoneId] = [];
  const groups = zoneGroups[zoneId];
  groups.forEach(g => { g.exhibitIds = g.exhibitIds.filter(id => items.some(e => e.id === id)); });

  const allGrouped = new Set(groups.flatMap(g => g.exhibitIds));
  const ungrouped = items.filter(e => !allGrouped.has(e.id));

  const zoneIdx = zones.indexOf(zone) + 1;
  document.getElementById('zd-title').textContent = zone.name;
  document.getElementById('zd-subtitle').textContent = zone.desc;
  document.getElementById('zd-stats').innerHTML = `
    <div class="zd-stat"><div class="sn">${items.length}</div><div class="sl">展品數</div></div>
    <div class="zd-stat"><div class="sn">${Object.keys(schoolMap).length}</div><div class="sl">學校</div></div>
    <div class="zd-stat"><div class="sn">${pending}</div><div class="sl">待確認</div></div>`;

  // Update zone badge
  const badge = document.getElementById('zd-zone-badge');
  if (badge) badge.textContent = `展區 ${zoneIdx}`;

  let html = ``;

  html += `<div class="zdg-planning-header">
    <span class="zdg-planning-title">展品分組</span>
    <button class="zdg-add-btn-inline" id="zd-add-grp-btn" onclick="addZoneGroup('${zoneId}')">＋ 新增群組</button>
  </div>`;

  html += `<div class="zdg-grid">`;
  groups.forEach(grp => {
    const grpExhibits = grp.exhibitIds.map(id => items.find(e => e.id === id)).filter(Boolean);
    html += `<div class="zdg-section">
      <div class="zdg-header" id="zdg-hdr-${grp.id}">
        <span class="zdg-header-name">${grp.name}</span>
        <button class="zdg-btn zdg-rename-btn" onclick="renameZoneGroup('${zoneId}','${grp.id}')" title="重新命名"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <span class="zdg-count">${grpExhibits.length} 件</span>
        <button class="zdg-btn danger" onclick="deleteZoneGroup('${zoneId}','${grp.id}')">✕</button>
      </div>
      <div class="zdg-drop${grpExhibits.length===0?' is-empty':''}" id="zdg-drop-${grp.id}"
        ondragover="zdGrpZoneOver(event,'${grp.id}')"
        ondragleave="zdGrpZoneLeave(event,'${grp.id}')"
        ondrop="zdGrpZoneDrop(event,'${grp.id}','${zoneId}')">
        ${grpExhibits.map(ex => renderPlanCard(ex, grp.id, zoneId)).join('')}
      </div>
    </div>`;
  });
  html += `</div>`;

  const showUngroupedLabel = groups.length > 0;
  if (!items.length) {
    // Completely empty zone - show helpful empty state with a large drop zone
    html += `<div class="zdg-drop zdg-ungrouped-drop zd-empty-drop" id="zdg-drop-__ungrouped__"
      ondragover="zdGrpZoneOver(event,'__ungrouped__')"
      ondragleave="zdGrpZoneLeave(event,'__ungrouped__')"
      ondrop="zdGrpZoneDrop(event,'__ungrouped__','${zoneId}')">
      <div class="zd-empty-state">
        <p>尚無展品分配至此展區</p>
        <small>從左側列表將展品拖曳到此處</small>
      </div>
    </div>`;
  } else {
    html += `<div class="zdg-section zdg-ungrouped-section">
      ${showUngroupedLabel ? `<div class="zdg-ungrouped-label">未分組${ungrouped.length > 0 ? ' ('+ungrouped.length+')' : ''}</div>` : ''}
      <div class="zdg-drop zdg-ungrouped-drop${ungrouped.length===0?' is-empty':''}" id="zdg-drop-__ungrouped__"
        ondragover="zdGrpZoneOver(event,'__ungrouped__')"
        ondragleave="zdGrpZoneLeave(event,'__ungrouped__')"
        ondrop="zdGrpZoneDrop(event,'__ungrouped__','${zoneId}')">
        ${ungrouped.map(ex => renderPlanCard(ex, '__ungrouped__', zoneId)).join('')}
      </div>
    </div>`;
  }

  document.getElementById('zd-body').innerHTML = html;
}

// ── Zone Detail: group management ─────────────────────
function addZoneGroup(zoneId) {
  const btn = document.getElementById('zd-add-grp-btn');
  if (!btn) return;
  btn.outerHTML = `<div id="zdg-add-form" class="zdg-add-form" style="margin-left:8px">
    <input class="zdg-name-input" id="zdg-add-input" placeholder="群組名稱…"
      onkeydown="if(event.key==='Enter')zdgConfirmAdd('${zoneId}',this.value);if(event.key==='Escape')renderZoneDetail(zones.find(z=>z.id==='${zoneId}'))">
    <button class="zdg-confirm-btn" onclick="zdgConfirmAdd('${zoneId}',document.getElementById('zdg-add-input').value)">確認</button>
    <button class="zdg-cancel-btn" onclick="renderZoneDetail(zones.find(z=>z.id==='${zoneId}'))">取消</button>
  </div>`;
  document.getElementById('zdg-add-input').focus();
}

function zdgConfirmAdd(zoneId, name) {
  name = (name || '').trim();
  if (!name) { document.getElementById('zdg-add-input')?.focus(); return; }
  if (!zoneGroups[zoneId]) zoneGroups[zoneId] = [];
  zoneGroups[zoneId].push({ id: 'g_' + Date.now(), name, exhibitIds: [] });
  saveData();
  renderZoneDetail(zones.find(z => z.id === zoneId));
}

function renameZoneGroup(zoneId, groupId) {
  const hdr = document.getElementById('zdg-hdr-' + groupId);
  if (!hdr) return;
  const grp = (zoneGroups[zoneId] || []).find(g => g.id === groupId);
  if (!grp) return;
  hdr.innerHTML = `
    <input class="zdg-name-input" value="${grp.name}" style="flex:1"
      onkeydown="if(event.key==='Enter')zdgConfirmRename('${zoneId}','${groupId}',this.value);if(event.key==='Escape')renderZoneDetail(zones.find(z=>z.id==='${zoneId}'))">
    <button class="zdg-confirm-btn" onclick="zdgConfirmRename('${zoneId}','${groupId}',this.parentElement.querySelector('input').value)">確認</button>
    <button class="zdg-cancel-btn" onclick="renderZoneDetail(zones.find(z=>z.id==='${zoneId}'))">取消</button>
  `;
  const inp = hdr.querySelector('input');
  inp.focus(); inp.select();
}

function zdgConfirmRename(zoneId, groupId, name) {
  name = (name || '').trim();
  if (!name) return;
  const grp = (zoneGroups[zoneId] || []).find(g => g.id === groupId);
  if (grp) { grp.name = name; saveData(); }
  renderZoneDetail(zones.find(z => z.id === zoneId));
}

function deleteZoneGroup(zoneId, groupId) {
  if (!confirm('刪除此群組？其中展品將移至未分組。')) return;
  zoneGroups[zoneId] = (zoneGroups[zoneId] || []).filter(g => g.id !== groupId);
  saveData();
  renderZoneDetail(zones.find(z => z.id === zoneId));
}

// ── Zone Detail: drag between groups ──────────────────
let zdGrpDragId = null;
let zdGrpFromGroup = null;

function zdGrpDragStart(e, exId, fromGroup) {
  zdGrpDragId = exId;
  zdGrpFromGroup = fromGroup;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.getElementById('zd-pc-' + exId);
    if (el) el.classList.add('zd-dragging');
  }, 0);
}

function zdGrpDragEnd() {
  document.querySelectorAll('.zd-plan-card').forEach(c => c.classList.remove('zd-dragging', 'zd-drag-over'));
  document.querySelectorAll('.zdg-drop').forEach(d => d.classList.remove('drag-over'));
  zdGrpDragId = null;
  zdGrpFromGroup = null;
}

function zdGrpCardOver(e, exId) {
  e.preventDefault();
  e.stopPropagation();
  if (zdGrpDragId === exId) return;
  document.querySelectorAll('.zd-plan-card').forEach(c => c.classList.remove('zd-drag-over'));
  document.querySelectorAll('.zdg-drop').forEach(d => d.classList.remove('drag-over'));
  const el = document.getElementById('zd-pc-' + exId);
  if (el) el.classList.add('zd-drag-over');
}

function zdGrpZoneOver(e, groupId) {
  e.preventDefault();
  document.querySelectorAll('.zd-plan-card').forEach(c => c.classList.remove('zd-drag-over'));
  document.querySelectorAll('.zdg-drop').forEach(d => d.classList.remove('drag-over'));
  const el = document.getElementById('zdg-drop-' + groupId);
  if (el) el.classList.add('drag-over');
}

function zdGrpZoneLeave(e, groupId) {
  const el = document.getElementById('zdg-drop-' + groupId);
  if (el) el.classList.remove('drag-over');
}

function zdGrpCardDrop(e, targetExId, targetGroupId, zoneId) {
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.zd-plan-card').forEach(c => c.classList.remove('zd-drag-over'));
  document.querySelectorAll('.zdg-drop').forEach(d => d.classList.remove('drag-over'));
  if (!zdGrpDragId || zdGrpDragId === targetExId) { zdGrpDragId = null; zdGrpFromGroup = null; return; }

  const srcGroupId = zdGrpFromGroup;
  const zgs = zoneGroups[zoneId] || [];

  if (srcGroupId !== '__ungrouped__') {
    const srcGrp = zgs.find(g => g.id === srcGroupId);
    if (srcGrp) srcGrp.exhibitIds = srcGrp.exhibitIds.filter(id => id !== zdGrpDragId);
  }

  if (targetGroupId !== '__ungrouped__') {
    const tgtGrp = zgs.find(g => g.id === targetGroupId);
    if (tgtGrp) {
      tgtGrp.exhibitIds = tgtGrp.exhibitIds.filter(id => id !== zdGrpDragId);
      const tgtIdx = tgtGrp.exhibitIds.indexOf(targetExId);
      tgtGrp.exhibitIds.splice(tgtIdx === -1 ? tgtGrp.exhibitIds.length : tgtIdx, 0, zdGrpDragId);
    }
  } else if (srcGroupId === '__ungrouped__') {
    const zoneItems = exhibits.filter(ex => ex.zone === zoneId);
    const others = exhibits.filter(ex => ex.zone !== zoneId);
    const fromIdx = zoneItems.findIndex(ex => ex.id === zdGrpDragId);
    const toIdx = zoneItems.findIndex(ex => ex.id === targetExId);
    if (fromIdx !== -1 && toIdx !== -1) {
      const [moved] = zoneItems.splice(fromIdx, 1);
      zoneItems.splice(toIdx, 0, moved);
      exhibits = [...others, ...zoneItems];
    }
  }

  zoneGroups[zoneId] = zgs;
  zdGrpDragId = null; zdGrpFromGroup = null;
  saveData();
  renderAll();
  renderZoneDetail(zones.find(z => z.id === zoneId));
}

function zdGrpZoneDrop(e, targetGroupId, zoneId) {
  e.preventDefault();
  document.querySelectorAll('.zdg-drop').forEach(d => d.classList.remove('drag-over'));

  // 從左側展品欄拖入
  if (dragId) {
    const ex = exhibits.find(ex => ex.id === dragId);
    if (ex) {
      snapshot();
      ex.zone = zoneId;
      if (targetGroupId !== '__ungrouped__') {
        if (!zoneGroups[zoneId]) zoneGroups[zoneId] = [];
        const grp = zoneGroups[zoneId].find(g => g.id === targetGroupId);
        if (grp && !grp.exhibitIds.includes(dragId)) grp.exhibitIds.push(dragId);
      }
    }
    const el = document.getElementById('card-' + dragId);
    if (el) el.classList.remove('dragging');
    dragId = null;
    renderAll();
    saveData();
    renderZoneDetail(zones.find(z => z.id === zoneId));
    return;
  }

  if (!zdGrpDragId) return;
  const srcGroupId = zdGrpFromGroup;
  if (srcGroupId === targetGroupId) { zdGrpDragId = null; zdGrpFromGroup = null; return; }

  const zgs = zoneGroups[zoneId] || [];

  if (srcGroupId !== '__ungrouped__') {
    const srcGrp = zgs.find(g => g.id === srcGroupId);
    if (srcGrp) srcGrp.exhibitIds = srcGrp.exhibitIds.filter(id => id !== zdGrpDragId);
  }

  if (targetGroupId !== '__ungrouped__') {
    const tgtGrp = zgs.find(g => g.id === targetGroupId);
    if (tgtGrp && !tgtGrp.exhibitIds.includes(zdGrpDragId)) {
      tgtGrp.exhibitIds.push(zdGrpDragId);
    }
  }

  zoneGroups[zoneId] = zgs;
  zdGrpDragId = null; zdGrpFromGroup = null;
  saveData();
  renderZoneDetail(zones.find(z => z.id === zoneId));
}

// ── Zone Detail: notes & remove ───────────────────────
function saveNotes(id, value) {
  const ex = exhibits.find(e => e.id === id);
  if (!ex || ex.notes === value) return;
  ex.notes = value;
  saveData();
}

function removeFromZoneDetail(id, zoneId) {
  snapshot();
  const ex = exhibits.find(e => e.id === id);
  if (!ex) return;
  ex.zone = 'pool';
  (zoneGroups[zoneId] || []).forEach(g => { g.exhibitIds = g.exhibitIds.filter(eid => eid !== id); });
  renderAll();
  renderZoneDetail(zones.find(z => z.id === zoneId));
  saveData();
}

function closeZoneDetail() {
  document.getElementById('zone-detail-overlay').classList.remove('open');
  document.getElementById('zones-panel').style.display = '';
  currentZoneId = null;
}

function zoneColDrop(e, targetZoneId) {

  e.stopPropagation();
  document.querySelectorAll('.zone-col').forEach(c => c.classList.remove('zone-col-drag-over'));
  if (!zoneDragId || zoneDragId === targetZoneId) { zoneDragId = null; return; }
  snapshot();
  const fromIdx = zones.findIndex(z => z.id === zoneDragId);
  const toIdx   = zones.findIndex(z => z.id === targetZoneId);
  const [moved] = zones.splice(fromIdx, 1);
  zones.splice(toIdx, 0, moved);
  zoneDragId = null;
  renderAll();
  saveData();
}

// ── Zone Add / Edit / Delete ───────────────────────────────────
let editingZoneId = null;

function openAddZoneModal() {
  editingZoneId = null;
  document.getElementById('az-modal-title').textContent = '新增展區空間';
  document.getElementById('az-name').value = '';
  document.getElementById('az-desc').value = '';
  document.getElementById('add-zone-overlay').classList.add('open');
  setTimeout(() => document.getElementById('az-name').focus(), 50);
}
function editZone(event, zoneId) {
  event.stopPropagation();
  const zone = zones.find(z => z.id === zoneId);
  if (!zone) return;
  editingZoneId = zoneId;
  document.getElementById('az-modal-title').textContent = '編輯展區空間';
  document.getElementById('az-name').value = zone.name;
  document.getElementById('az-desc').value = zone.desc;
  document.getElementById('add-zone-overlay').classList.add('open');
  setTimeout(() => document.getElementById('az-name').focus(), 50);
}
function closeAddZoneModal() {
  document.getElementById('add-zone-overlay').classList.remove('open');
  editingZoneId = null;
}
function confirmAddZone() {
  const name = document.getElementById('az-name').value.trim();
  const desc = document.getElementById('az-desc').value.trim();
  if (!name) { alert('請填寫名稱'); return; }
  snapshot();
  if (editingZoneId) {
    const zone = zones.find(z => z.id === editingZoneId);
    if (zone) Object.assign(zone, { name, desc });
  } else {
    zones.push({ id: 'z_' + Date.now(), name, desc });
  }
  closeAddZoneModal();
  renderAll();
  saveData();
}
function deleteZone(event, zoneId) {
  event.stopPropagation();
  const zone = zones.find(z => z.id === zoneId);
  if (!zone) return;
  const count = exhibits.filter(e => e.zone === zoneId).length;
  const msg = count > 0
    ? `確定移除「${zone.name}」？其中 ${count} 件展品將移回未分配。`
    : `確定移除「${zone.name}」？`;
  if (!confirm(msg)) return;
  snapshot();
  exhibits.forEach(e => { if (e.zone === zoneId) e.zone = 'pool'; });
  zones = zones.filter(z => z.id !== zoneId);
  delete zoneGroups[zoneId];
  renderAll();
  saveData();
}

function runMigration() {
  tagLibrary = tagLibrary.filter(t => !REMOVED_TAGS.includes(t));
  exhibits.forEach(ex => { ex.tags = ex.tags.filter(t => !REMOVED_TAGS.includes(t)); });
  exhibits.forEach(ex => ex.tags.forEach(t => { if (!tagLibrary.includes(t)) tagLibrary.push(t); }));
}

let unsubscribeData = null;

function subscribeData() {
  if (unsubscribeData) { unsubscribeData(); unsubscribeData = null; }
  unsubscribeData = db.collection('data').doc('main').onSnapshot(snap => {
    if (snap.exists) {
      const d = snap.data();
      exhibits = d.exhibits || [];
      tagLibrary = d.tagLibrary || [...DEFAULT_TAGS];
      zoneGroups = d.zoneGroups || {};
      zones = d.zones || JSON.parse(JSON.stringify(INIT_ZONES));
    } else {
      exhibits = JSON.parse(JSON.stringify(INIT_EXHIBITS));
      tagLibrary = [...DEFAULT_TAGS];
      zoneGroups = {};
      zones = JSON.parse(JSON.stringify(INIT_ZONES));
      runMigration();
      saveData();
      return;
    }
    initSchoolSelect();
    renderAll();
  });
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  auth.signInWithEmailAndPassword(email, password)
    .catch(() => { errEl.textContent = '帳號或密碼錯誤，請再試一次'; });
}

function doLogout() {
  if (confirm('確定要登出嗎？')) auth.signOut();
}

auth.onAuthStateChanged(user => {
  const overlay = document.getElementById('login-overlay');
  if (user) {
    overlay.style.display = 'none';
    document.getElementById('user-btn').title = user.email;
    subscribeData();
  } else {
    if (unsubscribeData) { unsubscribeData(); unsubscribeData = null; }
    overlay.style.display = 'flex';
  }
});
